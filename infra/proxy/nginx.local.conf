# Local equivalent of infra/proxy/nginx.conf, for docker-compose.full.yml.
# Same Host-based routing scheme, but for *.pulso.localhost over plain HTTP (no
# CloudFront/TLS locally — modern browsers treat the whole .localhost TLD as a
# secure context, so Secure cookies still work without HTTPS here).
#
#   api.pulso.localhost       → backend (Nest routes at the root, no /api strip)
#   pulso.localhost (apex)    → website (institutional landing)
#   *.pulso.localhost (other) → frontend (middleware derives the clinic slug from Host)

server {
  listen 80;
  server_name ~^api\.;

  client_max_body_size 15m;

  location / {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin $http_origin;
  }
}

server {
  listen 80;
  server_name pulso.localhost www.pulso.localhost;

  location / {
    proxy_pass http://website:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80 default_server;
  server_name _;

  location / {
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
