# Reverse proxy for the EC2 host. Sole origin of the CloudFront distribution.
# TLS terminates at CloudFront, so this speaks plain HTTP on :80 and trusts the
# X-Forwarded-Proto it sets. Routing is by Host:
#   api.pulso.center   → backend (Nest routes at the root, no /api strip)
#   *.pulso.center     → frontend (middleware derives the clinic slug from Host)

# API — dedicated host
server {
  listen 80;
  server_name api.pulso.center;

  # Clinic branding assets can be a few MB; keep uploads comfortable.
  client_max_body_size 15m;

  location / {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;   # original request was HTTPS (CloudFront)
    proxy_set_header Origin $http_origin;        # preserve Origin for CORS
  }
}

# Frontend — every other subdomain (clinics + backoffice.pulso.center) via default
server {
  listen 80 default_server;
  server_name _;

  location / {
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;                  # middleware derives the slug from Host
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
