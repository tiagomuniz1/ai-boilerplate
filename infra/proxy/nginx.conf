# Reverse proxy for the EC2 host. Sole origin of the CloudFront distribution.
# TLS terminates at CloudFront, so this speaks plain HTTP on :80 and trusts the
# X-Forwarded-Proto it sets. Routing is by Host:
#   api.pulso.center       → backend (Nest routes at the root, no /api strip)
#   pulso.center (apex)    → website (institutional landing) — staging + production
#   *.pulso.center (other) → frontend (middleware derives the clinic slug from Host)
#
# nginx server_name precedence: an exact name beats a regex/default server, so the
# apex block below wins for the base domain while api.* still matches the regex and
# every clinic/backoffice subdomain falls through to the default (frontend).

# API — dedicated host. Regex matches api.<any-domain> so the same config serves
# api.pulso.center (production) and api.staging.pulso.center (staging).
server {
  listen 80;
  server_name ~^api\.;

  # Clinic branding assets can be a few MB; keep uploads comfortable.
  client_max_body_size 15m;

  location / {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;   # original request was HTTPS (CloudFront)
    proxy_set_header Origin $http_origin;        # preserve Origin for CORS
  }
}

# Landing — the base domain apex (and www). Exact server_name, so it wins over the
# default server for staging.pulso.center / pulso.center while clinic subdomains do not.
server {
  listen 80;
  server_name staging.pulso.center www.staging.pulso.center pulso.center www.pulso.center;

  location / {
    proxy_pass http://website:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}

# Frontend — every other subdomain (clinics + backoffice.pulso.center) via default
server {
  listen 80 default_server;
  server_name _;

  location / {
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;                  # middleware derives the slug from Host
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
